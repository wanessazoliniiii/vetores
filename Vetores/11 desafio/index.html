<script>
    let numero = [];
    for (let i = 0; i < 10; i++) {
        numero[i] = parseInt(prompt("entre com o " + (i + 1) + "° numero"));
    }
    for (let i = 0; i < 10; i++) {
        for (let j = i + 1; j < 10; j++) {
            if (numero[i] > numero[j]) {
                let a = numero[i];
                numero[i] = numero[j];
                numero[j] = a;
            }
        }
    }
    document.write("Numeros em ordem crescente:" + numero);
</script>
